{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password — ShopEase{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/accounts.css' %}">{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Reset Password</h1>
      <p>Enter your email and we'll send you a reset link</p>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-input" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn-primary btn-block">Send reset link</button>
      <a href="{% url 'accounts:login' %}" class="btn-clear">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
