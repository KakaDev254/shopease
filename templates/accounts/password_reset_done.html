{% extends 'base.html' %}
{% load static %}
{% block title %}Email Sent — ShopEase{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/accounts.css' %}">{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card auth-success">
    <i data-lucide="mail-check"></i>
    <h1>Check your inbox</h1>
    <p>If an account exists with that email, we've sent a password reset link.</p>
    <a href="{% url 'accounts:login' %}" class="btn-primary">Back to login</a>
  </div>
</div>
{% endblock %}
