<div class="drawer-overlay" id="wishlist-overlay"></div>

<aside class="drawer wishlist-drawer" id="wishlist-drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2><i data-lucide="heart"></i> Wishlist</h2>
    <button class="drawer-close" id="wishlist-close" aria-label="Close wishlist">
      <i data-lucide="x"></i>
    </button>
  </div>

  <div class="drawer-body" id="wishlist-drawer-body">
    <!-- Filled dynamically by wishlist.js via /products/api/wishlist/drawer/ -->
    <div class="drawer-loading">
      <i data-lucide="loader-2"></i>
    </div>
  </div>
</aside>
